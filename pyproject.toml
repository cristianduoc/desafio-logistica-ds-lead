[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logistica"
version = "1.0.0"
description = "Desafío Data Scientist Lead: diagnóstico y corrección de pronóstico logístico, gate de cold start y análisis del plan de entrega."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
notebook = ["jupyter>=1.0", "nbconvert>=7.0", "ipykernel>=6.29"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
